name: Build Lumio APK

# Builds the Android app (android-lumio/) and publishes it two ways:
#  - Lumio.apk committed at the repo root, so the website serves /Lumio.apk
#  - a GitHub Release with the same file
on:
  push:
    branches: [main]
    paths:
      - 'android-lumio/**'
      - '.github/workflows/lumio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumio-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumio-release.jks"
            echo "LUMIO_KEYSTORE_PATH=$RUNNER_TEMP/lumio-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::LUMIO_KEYSTORE_BASE64 secret not set; signing with a debug key (updates will not install over each other)"
          fi

      - name: Build release APK
        working-directory: android-lumio
        env:
          VERSION_CODE: ${{ github.run_number }}
          LUMIO_KEYSTORE_PASSWORD: ${{ secrets.LUMIO_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Lumio.apk

      - name: Put Lumio.apk on the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lumio.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "Update Lumio.apk (build ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumio-apk-${{ github.run_number }}
          name: Lumio — Android ${{ github.run_number }}
          body: The Lumio Android app (APK). Also downloadable from the website at /Lumio.apk
          make_latest: true
          files: Lumio.apk
